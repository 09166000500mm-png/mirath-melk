name: miras_melk
description: Professional Real Estate Management System
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # Supabase
  supabase_flutter: ^2.8.0
  realtime_client: ^1.0.0
  
  # State Management
  provider: ^6.1.2
  
  # Navigation
  go_router: ^14.2.1
  
  # UI
  flutter_localizations:
    sdk: flutter
  intl: ^0.18.0
  syncfusion_flutter_datepicker: ^25.2.5
  syncfusion_flutter_charts: ^25.2.5
  
  # Image
  image_picker: ^1.1.2
  photo_view: ^0.15.0
  flutter_image_compress: ^2.3.0
  
  # Forms & Validation
  reactive_forms: ^17.0.0
  
  # Persian
  persian_tools: ^2.0.0
  shamsi_date: ^1.1.3
  
  # Storage
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2
  
  # Network
  http: ^1.2.2
  connectivity_plus: ^6.1.0
  
  # Utils
  uuid: ^4.4.2
  path: ^1.9.0
  url_launcher: ^6.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  infinite_scroll_pagination: ^4.0.0
  pull_to_refresh: ^2.0.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  
  assets:
    - assets/images/
    - assets/fonts/
  
  fonts:
    - family: Vazir
      fonts:
        - asset: assets/fonts/Vazir-Regular.ttf
        - asset: assets/fonts/Vazir-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "#1a237e"
  adaptive_icon_foreground: "assets/images/icon_foreground.png"
